name: Sprint-1 CI Pipeline & PR Automation

on:
  push:
    branches: [ main, master, 'feature/**', 'sprint-1/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Automated Testing & Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: |
          npm install --no-audit || true
          if [ -d "Sprint-1/sohel - Authentication and Integration" ]; then
            cd "Sprint-1/sohel - Authentication and Integration" && npm install --no-audit
          elif [ -d "Sprint-1/sohel" ]; then
            cd "Sprint-1/sohel" && npm install --no-audit
          fi

      - name: Run Sprint-1 Automated Verification Test Suite (STP Section 13.1 & 14)
        run: |
          if [ -d "Sprint-1/sohel - Authentication and Integration" ] && [ -f "Sprint-1/sohel - Authentication and Integration/integration/testRunner.js" ]; then
            cd "Sprint-1/sohel - Authentication and Integration" && node integration/testRunner.js
          elif [ -d "Sprint-1/sohel" ] && [ -f "Sprint-1/sohel/integration/testRunner.js" ]; then
            cd "Sprint-1/sohel" && node integration/testRunner.js
          else
            echo "Sohel testRunner not in current scope, skipping test suite."
          fi

  pr-compliance:
    name: PR Compliance & Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Sprint-1 File Structure
        run: |
          echo "Verifying Sprint-1 Deliverables..."
          (test -d "Sprint-1/sohel - Authentication and Integration" || test -d "Sprint-1/sohel") && echo "Found Sohel module" || true
          test -d "Sprint-1/navya" && echo "Found Sprint-1/navya" || true
          test -d "Sprint-1/nikhil_raj" && echo "Found Sprint-1/nikhil_raj" || true
          (test -d "Sprint-1/dheeraj" || test -d "Sprint-1/Dheeraj") && echo "Found Dheeraj module" || true
          test -f "Sprint-1/README.md" || (echo "Missing Sprint-1/README.md" && exit 1)
          echo "Sprint-1 PR deliverables structure verified successfully."
