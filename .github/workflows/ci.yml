name: CI Pipeline & PR Automation (Sprint 1 & Sprint 2)

on:
  push:
    branches: [ main, master, 'feature/**', 'sprint-1/**', 'sprint-2/**', 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Automated Testing & Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: |
          npm install --no-audit || true
          if [ -d "Sprint-2/sohel - Authentication and Integration" ]; then
            (cd "Sprint-2/sohel - Authentication and Integration" && npm install --no-audit)
          fi
          if [ -d "Sprint-1/sohel - Authentication and Integration" ]; then
            (cd "Sprint-1/sohel - Authentication and Integration" && npm install --no-audit)
          elif [ -d "Sprint-1/sohel" ]; then
            (cd "Sprint-1/sohel" && npm install --no-audit)
          fi

      - name: Run Automated Verification Test Suite (STP Section 13.1 & 14)
        run: |
          if [ -d "Sprint-2/sohel - Authentication and Integration" ] && [ -f "Sprint-2/sohel - Authentication and Integration/integration/testRunner.js" ]; then
            echo "Executing Sprint-2 Automated Verification..."
            (cd "Sprint-2/sohel - Authentication and Integration" && node integration/testRunner.js)
          fi
          if [ -d "Sprint-1/sohel - Authentication and Integration" ] && [ -f "Sprint-1/sohel - Authentication and Integration/integration/testRunner.js" ]; then
            echo "Executing Sprint-1 Automated Verification..."
            (cd "Sprint-1/sohel - Authentication and Integration" && node integration/testRunner.js)
          elif [ -d "Sprint-1/sohel" ] && [ -f "Sprint-1/sohel/integration/testRunner.js" ]; then
            (cd "Sprint-1/sohel" && node integration/testRunner.js)
          fi

  pr-compliance:
    name: PR Compliance & Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Deliverables Structure
        run: |
          echo "Verifying Deliverables..."
          (test -d "Sprint-1/sohel - Authentication and Integration" || test -d "Sprint-1/sohel" || test -d "Sprint-2/sohel - Authentication and Integration") && echo "Found Sohel module" || true
          test -f "Sprint-1/README.md" || test -f "Sprint-2/README.md" || (echo "Missing README.md" && exit 1)
          echo "PR deliverables structure verified successfully."
