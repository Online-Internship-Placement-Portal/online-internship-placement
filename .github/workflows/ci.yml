name: Sprint-1 CI Pipeline & PR Automation

on:
  push:
    branches: [ main, master, 'feature/**', 'sprint-1/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Automated Testing & Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies (Sohel Auth & Integration)
        run: |
          cd Sprint-1/sohel
          npm install

      - name: Run Sprint-1 Automated Verification Test Suite (STP Section 13.1 & 14)
        run: |
          cd Sprint-1/sohel
          node integration/testRunner.js

  pr-compliance:
    name: PR Compliance & Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Sprint-1 File Structure
        run: |
          echo "Verifying Sprint-1 Deliverables..."
          test -d "Sprint-1/sohel" || (echo "Missing Sprint-1/sohel" && exit 1)
          test -d "Sprint-1/navya" || (echo "Missing Sprint-1/navya" && exit 1)
          test -d "Sprint-1/nikhil_raj" || (echo "Missing Sprint-1/nikhil_raj" && exit 1)
          test -d "Sprint-1/dheeraj" || (echo "Missing Sprint-1/dheeraj" && exit 1)
          test -f "Sprint-1/Sprint-1-Deviations-and-Summary.md" || (echo "Missing Sprint-1 summary doc" && exit 1)
          echo "All Sprint-1 folders verified successfully."
